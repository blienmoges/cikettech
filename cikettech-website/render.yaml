services:
  - type: web
    name: cikettech-website
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_PUBLIC_API_BASE
        sync: false
      - key: INTERNAL_API_BASE
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false